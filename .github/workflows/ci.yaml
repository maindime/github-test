name: JPetStore CI Clean

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Donner les droits et Compiler
        # Le "chmod +x" est la clé pour passer au vert !
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests