name: JPetStore Final Artifact

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperer le code
        uses: actions/checkout@v4

      - name: 2. Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Compilation (Génère le fichier .war)
        # Cette étape est OBLIGATOIRE pour créer le dossier target
        run: mvn clean package -DskipTests

      - name: 4. Sauvegarder le Artifact
        # On utilise v4 pour être à jour
        uses: actions/upload-artifact@v4
        with:
          name: jpetstore-package
          path: target/*.war
